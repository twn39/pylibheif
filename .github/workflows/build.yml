name: Build and Publish

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-2022]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Lock Submodule Versions
        run: |
          cd third_party/libheif && git fetch --tags && git checkout v1.21.2
          cd ../kvazaar && git fetch --tags && git checkout v2.3.2
          cd ../dav1d && git fetch --tags && git checkout 1.5.3


      # Linux dependencies
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenjp2-7-dev nasm

      # macOS dependencies
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install openjpeg nasm

      # Windows dependencies
      - uses: ilammy/setup-nasm@v1
        if: runner.os == 'Windows'

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: |
          uv venv
          uv pip install meson ninja
          vcpkg install x265 libde265 aom dav1d openjpeg libjpeg-turbo --triplet x64-windows-static-md --overlay-triplets=triplets

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.3.1
        env:
          # Build versions
          LIBHEIF_TAG: v1.21.2
          KVAZAAR_TAG: v2.3.2
          
          # Build for Python 3.11-3.14
          CIBW_BUILD: cp311-* cp312-* cp313-* cp314-*
          # Skip 32-bit builds and musllinux
          CIBW_SKIP: "*-manylinux_i686 *musllinux* *-win32"
          
          # Install build dependencies
          CIBW_BEFORE_BUILD_LINUX: |
            if [ -x "$(command -v yum)" ]; then
              yum install -y epel-release
              /usr/bin/crb enable
              yum install -y --nogpgcheck https://mirrors.rpmfusion.org/free/el/rpmfusion-free-release-8.noarch.rpm
              yum install -y x265-devel libde265-devel libaom-devel openjpeg2-devel libjpeg-turbo-devel nasm git cmake
              curl -LsSf https://astral.sh/uv/install.sh | sh
              /root/.local/bin/uv venv /tmp/venv
              /root/.local/bin/uv pip install --python /tmp/venv meson ninja
            else
              apt-get install -y libx265-dev libde265-dev libaom-dev libopenjp2-7-dev libjpeg-dev nasm git cmake curl
              curl -LsSf https://astral.sh/uv/install.sh | sh
              /root/.cargo/bin/uv venv /tmp/venv || /root/.local/bin/uv venv /tmp/venv
              /root/.cargo/bin/uv pip install --python /tmp/venv meson ninja || /root/.local/bin/uv pip install --python /tmp/venv meson ninja
            fi
            
            # Export the venv bin path to PATH so meson/ninja can be found by subsequent build steps
            export PATH="/tmp/venv/bin:$PATH"
            
            # Build dav1d
            cd {project}/third_party/dav1d
            meson setup build --default-library=static --buildtype=release --prefix=/usr/local
            ninja -C build
            ninja -C build install

          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          
          CIBW_BEFORE_BUILD_MACOS: |
            brew install openjpeg nasm x265 libde265 aom jpeg meson ninja

          CIBW_CONFIG_SETTINGS_MACOS: cmake.define.CMAKE_OSX_DEPLOYMENT_TARGET=14.0
          
          # Fix: Help delocate find Homebrew libraries on macOS
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: >
            DYLD_LIBRARY_PATH=/opt/homebrew/lib:$DYLD_LIBRARY_PATH
            delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}
          
          # Windows Configuration
          CIBW_CONFIG_SETTINGS_WINDOWS: >
            cmake.define.CMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
            cmake.define.VCPKG_TARGET_TRIPLET=x64-windows-static-md
            cmake.define.VCPKG_OVERLAY_TRIPLETS={project}/triplets
          
          # Test the wheel
          # cibuildwheel automatically creates a test venv. We should use python -m pytest to guarantee
          # we run inside the cibuildwheel test venv rather than uv implicitly trying to run in the project root venv
          CIBW_TEST_REQUIRES: pytest numpy pytest-benchmark pillow-heif psutil pytest-asyncio
          CIBW_TEST_COMMAND: python -m pytest {project}/tests -v



      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build sdist
        run: uv build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/pylibheif
    permissions:
      id-token: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
