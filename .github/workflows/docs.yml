name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pylibheif/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply submodule patches
        shell: bash
        run: |
          if [ -d "patches/libheif" ]; then
            for patch in patches/libheif/*.patch; do
              if [ -f "$patch" ]; then
                echo "Applying $patch to third_party/libheif..."
                git -C third_party/libheif apply --check "../../$patch" && git -C third_party/libheif apply "../../$patch" || true
              fi
            done
          fi

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenjp2-7-dev nasm ninja-build cmake

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install package and docs dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e ".[all,docs]"
          # Ensure compiled extension is accessible in pylibheif package path for inspection
          python -c "import shutil, glob; [shutil.copy(f, 'pylibheif/') for f in glob.glob('.venv/lib/python*/site-packages/pylibheif/_pylibheif*.*') if not f.endswith('.py') and not f.endswith('.pyi')]"

      - name: Build MkDocs site
        run: |
          source .venv/bin/activate
          mkdocs build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
