site_name: pylibheif
site_description: High-performance Python bindings for libheif (HEIC/AVIF/JPEG2000) using nanobind
site_author: Curry Tang
site_url: https://twn39.github.io/pylibheif/
repo_url: https://github.com/twn39/pylibheif
repo_name: twn39/pylibheif
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - .venv/lib/python3.12/site-packages
            - .
          options:
            force_inspection: true
            preload_modules:
              - pylibheif._pylibheif
            show_root_heading: true
            show_root_toc_entry: true
            show_source: false
            show_signature_annotations: true
            docstring_style: google
            merge_init_into_class: true
            separate_signature: true

nav:
  - Overview: index.md
  - Getting Started: getting-started.md
  - User Guides:
      - Pillow Integration: guides/pillow.md
      - Color Science & HDR: guides/color-hdr.md
      - Streaming & Zero-Copy I/O: guides/streaming-io.md
      - Command-Line Interface (CLI): guides/cli.md
  - API Reference:
      - Core & Context: api/core.md
      - Encoders & Presets: api/encoder.md
      - Asynchronous API: api/async.md
      - Color & Gain Map: api/color.md
      - Pillow Extensions: api/pillow.md
      - Exceptions: api/errors.md
